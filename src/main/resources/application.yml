spring:
  application:
    name: authservice
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authservice}
    username: ${DB_USERNAME:authservice_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
  
  cache:
    type: redis
    redis:
      time-to-live: 600000
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.authservice: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n'

# JWT Configuration
jwt:
  issuer: ${JWT_ISSUER:auth-service}
  audience: ${JWT_AUDIENCE:application-api}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:15m}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:30d}
  algorithm: RS256

# Password Configuration
password:
  bcrypt-strength: ${PASSWORD_BCRYPT_STRENGTH:12}
  policy:
    min-length: 12
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: true

# Rate Limiting Configuration
rate-limit:
  login:
    max-attempts: ${RATE_LIMIT_LOGIN_ATTEMPTS:5}
    window: ${RATE_LIMIT_LOGIN_WINDOW:15m}
  registration:
    max-attempts: ${RATE_LIMIT_REGISTRATION_ATTEMPTS:3}
    window: ${RATE_LIMIT_REGISTRATION_WINDOW:1h}
  refresh:
    max-attempts: ${RATE_LIMIT_REFRESH_ATTEMPTS:10}
    window: ${RATE_LIMIT_REFRESH_WINDOW:5m}
  api:
    max-attempts: ${RATE_LIMIT_API_ATTEMPTS:100}
    window: ${RATE_LIMIT_API_WINDOW:1m}

# Secrets Manager (AWS or local for dev)
secrets:
  manager:
    enabled: ${SECRETS_MANAGER_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    prefix: ${SECRETS_PREFIX:authservice/production}

# Audit Configuration
audit:
  retention-days: 90
  
# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: '*'
  allow-credentials: true
  max-age: 3600

