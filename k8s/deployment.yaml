apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: production
  labels:
    app: authservice
    version: v1.0.0
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
        version: v1.0.0
    spec:
      serviceAccountName: authservice-sa
      containers:
        - name: authservice
          image: authservice:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8081
              name: actuator
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: JAVA_OPTS
              value: "-Xms1G -Xmx1.5G -X                        - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: authservice-db
                  key: url
            - name: DB_USE                    valueFrom:
                secretKeyRef:
                  name: authservice-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authservice-db
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: authservice-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                                  e-redis
                  key: password
          resources:
            requests:
              cpu: 500m
                                          ts:
              cpu: 1000m
                                    livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadameta  name: authservice
  names  names  names  nspec:
                               - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: authservice
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: authservice-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: authservice
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resourc           name: memory
        target:
          type: Utilization
          averageUtilization: 80
